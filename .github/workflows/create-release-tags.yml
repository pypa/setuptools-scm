name: Create Release Tags

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions: {}

jobs:
  create-tags:
    # Only run if PR was merged and has release labels (primary repo — tags/PyPI dispatch)
    if: |
      github.repository == 'pypa/setuptools-scm' &&
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:setuptools-scm') ||
       contains(github.event.pull_request.labels.*.name, 'release:vcs-versioning'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create tags and releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const prTitle = pr.title;
            const mergeCommitSha = pr.merge_commit_sha;
            const labels = pr.labels.map(l => l.name);

            console.log(`Processing PR #${pr.number}: ${prTitle}`);
            console.log(`Merge commit: ${mergeCommitSha}`);
            console.log(`Labels: ${labels.join(', ')}`);

            const tagsCreated = [];

            // Helper to extract version from PR title
            function extractVersion(title, packageName) {
              const regex = new RegExp(`${packageName} v(\\d+\\.\\d+\\.\\d+)`);
              const match = title.match(regex);
              return match ? match[1] : null;
            }

            // Helper to extract changelog section for a version
            async function extractChangelog(packageDir, version) {
              try {
                const { data: file } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: `${packageDir}/CHANGELOG.md`,
                  ref: mergeCommitSha
                });

                const content = Buffer.from(file.content, 'base64').toString('utf-8');
                const lines = content.split('\n');

                let inSection = false;
                let changelog = [];

                for (const line of lines) {
                  if (line.startsWith(`## ${version}`)) {
                    inSection = true;
                    continue; // Skip the header line
                  }
                  if (inSection && line.match(/^## \d/)) {
                    break; // Next version section
                  }
                  if (inSection) {
                    changelog.push(line);
                  }
                }

                // Trim leading/trailing empty lines
                while (changelog.length > 0 && changelog[0].trim() === '') {
                  changelog.shift();
                }
                while (changelog.length > 0 && changelog[changelog.length - 1].trim() === '') {
                  changelog.pop();
                }

                return changelog.join('\n');
              } catch (error) {
                console.log(`Could not extract changelog: ${error.message}`);
                return `Release ${version}`;
              }
            }

            // The release is created as a draft and published by python-tests.yml
            // only after the PyPI upload succeeded. Releases are immutable once
            // published, so assets can only be attached while it is a draft, and
            // a draft left behind marks a release that never reached PyPI.
            // A draft does not create its tag, so the tag is pushed first: the
            // dispatch below needs it as a ref. createRef on the commit makes a
            // lightweight tag, unlike createTag, which leaves a dangling tag object.
            async function createTagAndRelease(packageName, packageDir, tagPrefix) {
              const version = extractVersion(prTitle, packageName);
              if (!version) {
                throw new Error(`Failed to extract ${packageName} version from PR title: ${prTitle}`);
              }

              const tagName = `${tagPrefix}-v${version}`;
              const changelog = await extractChangelog(packageDir, version);

              console.log(`Creating tag ${tagName} at ${mergeCommitSha}`);
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: mergeCommitSha
              });

              const { data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `${packageName} v${version}`,
                body: changelog,
                draft: true,
                prerelease: false
              });

              console.log(`Draft release created: ${release.html_url}`);
              tagsCreated.push(tagName);
              return { tagName, version };
            }

            // Process setuptools-scm
            if (labels.includes('release:setuptools-scm')) {
              console.log('\n--- Processing setuptools-scm ---');
              await createTagAndRelease('setuptools-scm', 'setuptools-scm', 'setuptools-scm');
            }

            // Process vcs-versioning
            if (labels.includes('release:vcs-versioning')) {
              console.log('\n--- Processing vcs-versioning ---');
              await createTagAndRelease('vcs-versioning', 'vcs-versioning', 'vcs-versioning');
            }

            // Dispatch python-tests.yml for each tag to trigger PyPI upload.
            // Tags created by GITHUB_TOKEN don't trigger push-based workflows,
            // but workflow_dispatch events dispatched by GITHUB_TOKEN DO.
            for (const tagName of tagsCreated) {
              console.log(`Dispatching python-tests.yml for ${tagName}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'python-tests.yml',
                ref: tagName
              });
            }

            const summary = `## Tags Created\n\n${tagsCreated.map(t => `- \`${t}\``).join('\n')}\n\nPyPI upload dispatched via workflow_dispatch for each tag. Each GitHub release stays a draft until its package is on PyPI; a failed run opens an issue.`;
            await core.summary.addRaw(summary).write();

            console.log(`\nDone! Created tags: ${tagsCreated.join(', ')}`);

  release-failed:
    # python-tests.yml reports failures of the release runs it is dispatched for;
    # a failure here means those runs never started, so report it the same way.
    needs: [create-tags]
    if: |
      (failure() || cancelled()) &&
      github.repository == 'pypa/setuptools-scm'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          title="Release from #$PR_NUMBER did not start"
          body="Creating the tags and draft releases for #$PR_NUMBER ($PR_TITLE) failed: $RUN_URL

          The run log shows which tags and draft releases were created and which release runs were dispatched before the failure. A re-run fails on a tag that already exists; delete those tags and their draft releases first."
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi
