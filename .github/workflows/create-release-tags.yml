name: Create Release Tags

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions: {}

jobs:
  create-tags:
    # Only run if PR was merged and has release labels (primary repo — tags/PyPI dispatch)
    if: |
      github.repository == 'pypa/setuptools-scm' &&
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:setuptools-scm') ||
       contains(github.event.pull_request.labels.*.name, 'release:vcs-versioning'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - name: Create tags and releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const prTitle = pr.title;
            const mergeCommitSha = pr.merge_commit_sha;
            const labels = pr.labels.map(l => l.name);

            console.log(`Processing PR #${pr.number}: ${prTitle}`);
            console.log(`Merge commit: ${mergeCommitSha}`);
            console.log(`Labels: ${labels.join(', ')}`);

            const tagsCreated = [];

            // Helper to extract version from PR title
            function extractVersion(title, packageName) {
              const regex = new RegExp(`${packageName} v(\\d+\\.\\d+\\.\\d+)`);
              const match = title.match(regex);
              return match ? match[1] : null;
            }

            // Helper to extract changelog section for a version
            async function extractChangelog(packageDir, version) {
              try {
                const { data: file } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: `${packageDir}/CHANGELOG.md`,
                  ref: mergeCommitSha
                });

                const content = Buffer.from(file.content, 'base64').toString('utf-8');
                const lines = content.split('\n');

                let inSection = false;
                let changelog = [];

                for (const line of lines) {
                  if (line.startsWith(`## ${version}`)) {
                    inSection = true;
                    continue; // Skip the header line
                  }
                  if (inSection && line.match(/^## \d/)) {
                    break; // Next version section
                  }
                  if (inSection) {
                    changelog.push(line);
                  }
                }

                // Trim leading/trailing empty lines
                while (changelog.length > 0 && changelog[0].trim() === '') {
                  changelog.shift();
                }
                while (changelog.length > 0 && changelog[changelog.length - 1].trim() === '') {
                  changelog.pop();
                }

                return changelog.join('\n');
              } catch (error) {
                console.log(`Could not extract changelog: ${error.message}`);
                return `Release ${version}`;
              }
            }

            // The release is created as a draft and published by python-tests.yml
            // only after the PyPI upload succeeded. Releases are immutable once
            // published, so assets can only be attached while it is a draft, and
            // a draft left behind marks a release that never reached PyPI.
            // A draft does not create its tag, so the tag is pushed first: the
            // dispatch below needs it as a ref. createRef on the commit makes a
            // lightweight tag, unlike createTag, which leaves a dangling tag object.
            // Every step reuses what an earlier attempt already created, so
            // re-running this workflow after a partial failure fills the gaps
            // instead of failing on the first tag that exists.
            async function ensureTag(tagName) {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tagName}`,
                  sha: mergeCommitSha
                });
                console.log(`Created tag ${tagName} at ${mergeCommitSha}`);
              } catch (error) {
                if (error.status !== 422) throw error;
                const { data: ref } = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`
                });
                if (ref.object.sha !== mergeCommitSha) {
                  throw new Error(`Tag ${tagName} exists at ${ref.object.sha}, not at the merge commit ${mergeCommitSha}`);
                }
                console.log(`Tag ${tagName} already exists at ${mergeCommitSha}`);
              }
            }

            async function ensureDraftRelease(packageName, packageDir, version, tagName) {
              // getReleaseByTag does not return drafts
              const [existing] = await github.paginate(
                github.rest.repos.listReleases,
                { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
                (response, done) => {
                  const match = response.data.filter(r => r.tag_name === tagName);
                  if (match.length) done();
                  return match;
                },
              );
              if (existing) {
                console.log(`Release for ${tagName} already exists (draft: ${existing.draft}): ${existing.html_url}`);
                return existing;
              }
              const { data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `${packageName} v${version}`,
                body: await extractChangelog(packageDir, version),
                draft: true,
                prerelease: false
              });
              console.log(`Draft release created: ${release.html_url}`);
              return release;
            }

            async function createTagAndRelease(packageName, packageDir, tagPrefix) {
              const version = extractVersion(prTitle, packageName);
              if (!version) {
                throw new Error(`Failed to extract ${packageName} version from PR title: ${prTitle}`);
              }

              const tagName = `${tagPrefix}-v${version}`;
              await ensureTag(tagName);
              const release = await ensureDraftRelease(packageName, packageDir, version, tagName);
              if (!release.draft) {
                console.log(`${tagName} is already published; nothing to dispatch`);
                return;
              }
              tagsCreated.push(tagName);
            }

            // Process setuptools-scm
            if (labels.includes('release:setuptools-scm')) {
              console.log('\n--- Processing setuptools-scm ---');
              await createTagAndRelease('setuptools-scm', 'setuptools-scm', 'setuptools-scm');
            }

            // Process vcs-versioning
            if (labels.includes('release:vcs-versioning')) {
              console.log('\n--- Processing vcs-versioning ---');
              await createTagAndRelease('vcs-versioning', 'vcs-versioning', 'vcs-versioning');
            }

            // Dispatch python-tests.yml for each tag to trigger PyPI upload.
            // Tags created by GITHUB_TOKEN don't trigger push-based workflows,
            // but workflow_dispatch events dispatched by GITHUB_TOKEN DO.
            // A second dispatch for a tag would land in the same concurrency
            // group and cancel a release run that may be mid-upload, so a tag
            // that already has a release run is left to that run.
            const dispatched = [];
            for (const tagName of tagsCreated) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'python-tests.yml',
                event: 'workflow_dispatch',
                branch: tagName,
                per_page: 1
              });
              if (runs.total_count > 0) {
                core.warning(`${tagName} already has a release run, ${runs.workflow_runs[0].html_url}; re-run its failed jobs instead`);
                continue;
              }
              console.log(`Dispatching python-tests.yml for ${tagName}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'python-tests.yml',
                ref: tagName
              });
              dispatched.push(tagName);
            }

            const summary = `## Release runs dispatched\n\n${dispatched.map(t => `- \`${t}\``).join('\n') || 'none'}\n\nEach GitHub release stays a draft until its package is on PyPI; a failed run opens an issue.`;
            await core.summary.addRaw(summary).write();

            // a re-run that gets the release going resolves the issue release-failed opened
            const failureTitle = `Release from #${pr.number} did not start`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            for (const issue of openIssues.filter(i => !i.pull_request && i.title === failureTitle)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `Release runs dispatched: ${dispatched.join(', ') || 'none needed'}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed'
              });
              core.notice(`Closed #${issue.number}`);
            }

  release-failed:
    # python-tests.yml reports failures of the release runs it is dispatched for;
    # a failure here means those runs never started, so report it the same way.
    needs: [create-tags]
    if: |
      (failure() || cancelled()) &&
      github.repository == 'pypa/setuptools-scm'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the release failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const title = `Release from #${context.payload.pull_request.number} did not start`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = open.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: `Failed again: ${runUrl}`
              });
              core.notice(`Commented on #${existing.number}`);
            } else {
              const body = [
                `Creating the tags and draft releases for #${context.payload.pull_request.number} (${context.payload.pull_request.title}) failed: ${runUrl}`,
                '',
                'The run log shows which tags and draft releases were created and which release runs were dispatched before the failure. Re-running this run reuses what exists, creates what is missing, dispatches the release runs that never started, and closes this issue.',
              ].join('\n');
              const { data: issue } = await github.rest.issues.create({ owner, repo, title, body });
              core.notice(`Opened #${issue.number}`);
            }
