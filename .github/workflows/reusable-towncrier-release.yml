name: Reusable Towncrier Release

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Name of the project (used for labeling and tag prefix)'
        required: true
        type: string
      project_directory:
        description: 'Directory containing the project (relative to repository root)'
        required: true
        type: string
    outputs:
      version:
        description: 'The determined next version'
        value: ${{ jobs.determine-version.outputs.version }}
      has_fragments:
        description: 'Whether fragments were found'
        value: ${{ jobs.determine-version.outputs.has_fragments }}

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_fragments: ${{ steps.check.outputs.has_fragments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: |
          uv sync --all-packages --group release

      - name: Check for fragments
        id: check
        working-directory: ${{ inputs.project_directory }}
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          if [ ! -d "changelog.d" ]; then
            echo "has_fragments=false" >> "$GITHUB_OUTPUT"
            echo "No changelog.d directory for $PROJECT_NAME, skipping"
            exit 0
          fi

          FRAGMENT_COUNT=$(find changelog.d -type f -name "*.*.md" ! -name "template.md" ! -name "README.md" 2>/dev/null | wc -l)

          if [ "$FRAGMENT_COUNT" -eq 0 ]; then
            echo "has_fragments=false" >> "$GITHUB_OUTPUT"
            echo "No changelog fragments for $PROJECT_NAME, skipping"
            exit 0
          fi

          echo "has_fragments=true" >> "$GITHUB_OUTPUT"
          echo "Found $FRAGMENT_COUNT fragment(s) for $PROJECT_NAME"

      - name: Determine version
        if: steps.check.outputs.has_fragments == 'true'
        id: version
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_DIRECTORY: ${{ inputs.project_directory }}
        run: |
          # Version scheme is read from the project's pyproject.toml config
          NEXT_VERSION=$(uv run python -m vcs_versioning \
            -c "$PROJECT_DIRECTORY/pyproject.toml" \
            --strip-dev 2>&1 | grep -oP '^\d+\.\d+\.\d+' || echo "")

          if [ -z "$NEXT_VERSION" ]; then
            echo "ERROR: Failed to determine version for $PROJECT_NAME"
            echo "Version scheme did not return a valid version"
            exit 1
          fi

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Determined version: $NEXT_VERSION for $PROJECT_NAME"

  build-changelog:
    needs: determine-version
    if: needs.determine-version.outputs.has_fragments == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: |
          uv sync --all-packages --group release

      - name: Run towncrier
        working-directory: ${{ inputs.project_directory }}
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          NEXT_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          if ! uv run towncrier build --version "$NEXT_VERSION" --yes; then
            echo "ERROR: towncrier build failed for $PROJECT_NAME"
            exit 1
          fi

      - name: Upload changelog artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-${{ inputs.project_name }}
          path: |
            ${{ inputs.project_directory }}/CHANGELOG.md
            ${{ inputs.project_directory }}/changelog.d/
          retention-days: 5
